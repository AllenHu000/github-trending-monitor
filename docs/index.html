<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Trending Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0; padding: 24px; max-width: 1080px; margin-inline: auto; line-height: 1.5;
    }
    h1 { margin-bottom: 4px; }
    .meta { color: #888; margin-bottom: 24px; }
    section { margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e0e0e0aa; }
    th { position: sticky; top: 0; }
    a { color: #2f81f7; text-decoration: none; }
    a:hover { text-decoration: underline; }
    select { padding: 6px 10px; font-size: 14px; margin-bottom: 12px; }
    .card { border: 1px solid #e0e0e0aa; border-radius: 10px; padding: 16px; }
    .error { color: #d33; }
  </style>
</head>
<body>
  <h1>GitHub Trending Monitor</h1>
  <div class="meta" id="meta">加载中…</div>

  <div class="grid">
    <section class="card">
      <h2>语言分布</h2>
      <canvas id="langChart"></canvas>
    </section>
    <section class="card">
      <h2>单仓库 Star 趋势</h2>
      <select id="repoSelect"></select>
      <canvas id="trendChart"></canvas>
    </section>
  </div>

  <section>
    <h2>当日榜单</h2>
    <table>
      <thead>
        <tr><th>#</th><th>仓库</th><th>⭐ Stars</th><th>语言</th><th>描述</th></tr>
      </thead>
      <tbody id="repoTable"></tbody>
    </table>
  </section>

  <script>
    async function main() {
      let data;
      try {
        const res = await fetch('./data.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
      } catch (err) {
        document.getElementById('meta').innerHTML =
          `<span class="error">加载 data.json 失败：${err.message}</span>`;
        return;
      }

      document.getElementById('meta').textContent = `生成时间：${data.generated_at}`;
      renderTable(data.repos || []);
      renderLangChart(data.languages || {});
      renderTrend(data.series || {});
    }

    function renderTable(repos) {
      const tbody = document.getElementById('repoTable');
      tbody.innerHTML = repos.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.name)}</a></td>
          <td>${r.stars}</td>
          <td>${escapeHtml(r.language || 'Unknown')}</td>
          <td>${escapeHtml(r.description || '')}</td>
        </tr>`).join('');
    }

    function renderLangChart(languages) {
      const labels = Object.keys(languages);
      const values = Object.values(languages);
      new Chart(document.getElementById('langChart'), {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values }] },
        options: { plugins: { legend: { position: 'right' } } },
      });
    }

    let trendChart;
    function renderTrend(series) {
      const select = document.getElementById('repoSelect');
      const names = Object.keys(series).sort();
      if (names.length === 0) {
        select.innerHTML = '<option>暂无时序数据</option>';
        return;
      }
      select.innerHTML = names.map((n) => `<option value="${encodeURIComponent(n)}">${escapeHtml(n)}</option>`).join('');
      select.addEventListener('change', () => drawTrend(series, decodeURIComponent(select.value)));
      drawTrend(series, names[0]);
    }

    function drawTrend(series, name) {
      const points = series[name] || [];
      const labels = points.map((p) => p.date);
      const values = points.map((p) => p.stars);
      if (trendChart) trendChart.destroy();
      trendChart = new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: { labels, datasets: [{ label: name, data: values, tension: 0.2, fill: false }] },
        options: { scales: { y: { beginAtZero: false } } },
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    main();
  </script>
</body>
</html>
