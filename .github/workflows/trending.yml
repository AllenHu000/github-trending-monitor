name: GitHub Trending Monitor

on:
  schedule:
    # UTC 时间，对应北京时间早上8点执行，可自行调整
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持手动立即运行

jobs:
  fetch-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run trending crawler
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: python fetch_trending.py

      - name: Save & Commit results
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add trending_history.json daily_new.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update trending data"
          git push
