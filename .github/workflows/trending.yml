name: GitHub Trending Monitor

on:
  schedule:
    # UTC 时间，对应北京时间早上8点执行，可自行调整
    - cron: "0 0 * * *"
  workflow_dispatch: # 支持手动立即运行

jobs:
  fetch-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Run trending crawler
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: ./target/release/github-trending-monitor

      - name: Save & Commit results
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add trending_history.json star_history.json daily_new.md docs/data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update trending data"
          git push
